    <rect x="112" y="106" width="72" height="14" rx="2" fill="#3f8f6b"/><text x="148" y="117" fill="#fff" font-size="11">1</text>

    <path d="M204 76h20M217 69l7 7-7 7" stroke="#3f8f6b" stroke-width="3"/>

    <rect x="228" y="26" width="104" height="100" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
