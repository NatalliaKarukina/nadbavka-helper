    <path d="M45 330V230" stroke="#2b7a4b" stroke-width="3"/>
    <g fill="#3f8f6b"><ellipse cx="34" cy="305" rx="11" ry="6" transform="rotate(-30 34 305)"/><ellipse cx="56" cy="290" rx="11" ry="6" transform="rotate(30 56 290)"/><ellipse cx="34" cy="268" rx="11" ry="6" transform="rotate(-30 34 268)"/><ellipse cx="56" cy="250" rx="11" ry="6" transform="rotate(30 56 250)"/><ellipse cx="45" cy="228" rx="6" ry="11"/></g>
