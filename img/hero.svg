  <circle cx="238" cy="199" r="6" fill="#f2c9a5"/>
  <circle cx="162" cy="134" r="19" fill="#f2c9a5"/>
  <path d="M142 136c-2-20 8-30 22-30s24 10 20 30c-4-10-10-14-20-14s-18 4-22 14z" fill="#2b2b2b"/>
  <path d="M142 136v24q-6-4-4-22z" fill="#2b2b2b"/>
  <circle cx="166" cy="134" r="2" fill="#2b2b2b"/><circle cx="178" cy="134" r="2" fill="#2b2b2b"/><path d="M162 127l7-2M175 125l7 2" stroke="#2b2b2b" stroke-width="2"/><path d="M168 144q5 4 10 0" stroke="#2b2b2b" stroke-width="2"/>

