  <circle cx="392" cy="142" r="6" fill="#f2c9a5"/><circle cx="490" cy="142" r="6" fill="#f2c9a5"/>
  <circle cx="440" cy="134" r="20" fill="#f2c9a5"/>
  <path d="M420 132c0-18 9-26 21-26s22 8 20 26c-4-8-10-11-20-11s-15 3-21 11z" fill="#2b2b2b"/>
  <path d="M424 142q2 22 16 24q14-2 16-24q-6 8-16 8t-16-8z" fill="#2b2b2b"/>
